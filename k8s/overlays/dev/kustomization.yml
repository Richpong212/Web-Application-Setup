apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-app-dev

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/name: sample-app
      app.kubernetes.io/environment: dev
      app.kubernetes.io/managed-by: argocd

images:
  - name: sample-app-backend-image
    newName: ghcr.io/your-org/your-repo/backend
    newTag: "CHANGE_ME_IMAGE_TAG"

  - name: sample-app-admin-image
    newName: ghcr.io/your-org/your-repo/admin
    newTag: "CHANGE_ME_IMAGE_TAG"
