name: Daily8 Backend CI/CD

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "k8s/base/backend/**"
  pull_request:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "k8s/base/backend/**"

concurrency:
  group: rp-ranch-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/richpong212/rp-ranch/backend
  IMAGE_TAG: ${{ github.sha }}
  DOCKERFILE_PATH: ./backend/Dockerfile.backend
  BUILD_CONTEXT: ./backend
  KUSTOMIZATION_PATH: k8s/overlays/dev/kustomization.yml

jobs:
  check:
    name: Check backend
    runs-on: ubuntu-latest
