# Isolated disposable services; never mounts application or developer database data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backend_test
      POSTGRES_USER: backend_test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_test -d backend_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "test-only-redis", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test-only-redis", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
